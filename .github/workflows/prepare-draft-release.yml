name: prepare draft release

on:
  push:
    branches: [main]
    paths:
      - bundled-binary.sha256
  workflow_dispatch:
    inputs:
      version:
        description: Action release version tag (for example, v0.2.3)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(scripts/prepare-draft-release.sh resolve-version)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to rewrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/prepare-draft-release.sh assert-release-is-writable

      - name: Delete existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release delete "${VERSION}" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true

      - name: Create draft release with current release notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
